name: Input demo
on: 
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
     tags:
        description: 'Test scenario'
        required: false
        type: boolean

jobs:
    #job name
    trigger:
        runs-on: ubuntu-latest #Github hosted runners
        steps:
            #- name: Manually dispatch
             # run: echo "manually dispatch"
            - name: main branch push
              run: |
                 echo "Log level: ${{ inputs.logLevel }}"
                 echo "Tags: ${{ inputs.tags }}"